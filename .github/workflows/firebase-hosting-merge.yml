# Deploys to the live channel on every push to main.
#
# Originally generated by the Firebase CLI, then fixed: the generated version ran
# `npm ci`, which fails here because this project uses pnpm and has no
# package-lock.json. It also built without the VITE_ variables, which would have
# deployed a broken app — hence the guard step below.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Catch missing configuration here rather than shipping a broken app.
      # A missing client ID throws only at runtime, and a missing redirect URI
      # silently falls back to http://127.0.0.1:5173/ — so sign-in would fail
      # after the Spotify consent screen with nothing having failed in CI.
      - name: Check required variables are set
        env:
          CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          REDIRECT_URI: ${{ vars.VITE_SPOTIFY_REDIRECT_URI }}
        run: |
          missing=0
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Repository variable VITE_SPOTIFY_CLIENT_ID is not set"
            missing=1
          fi
          if [ -z "$REDIRECT_URI" ]; then
            echo "::error::Repository variable VITE_SPOTIFY_REDIRECT_URI is not set"
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URI: ${{ vars.VITE_SPOTIFY_REDIRECT_URI }}
        run: pnpm build

      # Prove the deployed bundle carries the intended redirect URI. A mismatch
      # is the failure that is hardest to diagnose from a phone.
      - name: Verify redirect URI in bundle
        env:
          REDIRECT_URI: ${{ vars.VITE_SPOTIFY_REDIRECT_URI }}
        run: |
          if grep -qF "$REDIRECT_URI" dist/assets/*.js; then
            echo "Bundle contains $REDIRECT_URI"
          else
            echo "::error::Built bundle does not contain $REDIRECT_URI"
            exit 1
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SONGLINE_7CCE1 }}
          channelId: live
          projectId: songline-7cce1
