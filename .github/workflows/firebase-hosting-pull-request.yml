# Runs checks and deploys a preview channel for each pull request.
#
# Originally generated by the Firebase CLI, then fixed to use pnpm and to supply the
# VITE_ variables at build time.
#
# KNOWN LIMITATION — Spotify sign-in does not work on preview channels. Each preview
# gets its own URL (songline-7cce1--pr-N-<hash>.web.app), and Spotify requires
# redirect URIs to match exactly with no wildcards, so a preview origin can never be
# registered ahead of time. The app detects this and shows its "Wrong address"
# screen rather than failing after the consent screen. Previews are therefore useful
# for checking that the build works and for non-authenticated UI, not for playing.

name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URI: ${{ vars.VITE_SPOTIFY_REDIRECT_URI }}
        run: pnpm build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SONGLINE_7CCE1 }}
          projectId: songline-7cce1
